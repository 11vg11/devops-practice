<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101827">
    <title>DevOps Starter</title>
    <link rel="stylesheet" href="/style.css">
    <script src="/app.js" defer></script>
  </head>
  <body>
    <main class="card">
      <div class="icon" aria-hidden="true">🚀</div>
      <p class="eyebrow">YOUR FIRST DEPLOYMENT</p>
      <h1>Hello, DevOps!</h1>
      <p class="description">A tiny web app with its own backend, ready for its first deployment.</p>
      <div class="status status--checking" role="status">
        <span class="status-dot" aria-hidden="true"></span>
        <span id="backend-status">Checking backend…</span>
      </div>
      <p class="time">Your local time: <time id="clock">Loading…</time></p>
    </main>
  </body>
</html>
